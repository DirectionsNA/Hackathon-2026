name: "Hackathon idea"

on:
  issues:
    types: [opened]

jobs:
  check-deadline-and-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Determine if submission is on time
        id: check
        run: |
          # Issue creation time (UTC) from event payload
          ISSUE_CREATED="${{ github.event.issue.created_at }}"

          # Deadline is 14:30 EDT on 2026-04-29, which is 18:30 UTC
          DEADLINE_UTC="2026-04-29 18:30:00"

          ISSUE_EPOCH=$(date -u -d "$ISSUE_CREATED" +%s)
          DEADLINE_EPOCH=$(date -u -d "$DEADLINE_UTC" +%s)

          echo "Issue created at (UTC): $ISSUE_CREATED"
          echo "Deadline (UTC): $DEADLINE_UTC"

          if [ "$ISSUE_EPOCH" -le "$DEADLINE_EPOCH" ]; then
            echo "on_time=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_time=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add base "idea" label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: idea

      - name: Add "on-time" label
        if: steps.check.outputs.on_time == 'true'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: on-time

      - name: Add "late" label
        if: steps.check.outputs.on_time != 'true'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: late

      # Status comment (explicitly stating on time or late)
      - name: Status comment — on time
        if: steps.check.outputs.on_time == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Status:** This idea was **created on time**.
            _Deadline: 14:30 EDT (2026-04-29), which is 18:30 UTC._

      - name: Status comment — late
        if: steps.check.outputs.on_time != 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Status:** This idea was **created too late**.
            _Deadline: 14:30 EDT (2026-04-29), which is 18:30 UTC._

      # Friendly message tailored to on-time vs late
      - name: Friendly comment — on time
        if: steps.check.outputs.on_time == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👋 Hi @${{ github.event.issue.user.login }}!  
            Thanks for submitting your **Directions North America 2026 Hackathon idea** 🎉  

            If your Directions North America 2026 checks OK, you're officially part of the hackathon!  
            - 🕒 Submission received **on time** (before 14:30 EDT on Apr 29, 2026).  
            - 🚀 Development runs until **July 31, 2026**.  
            - 🏁 Finalization & submission on **August 1, 2026** (including demo video).  
            - 🏆 Winner announced during the **Directions Webinar in late August 2026**.

            Good luck — we can't wait to see what you build! 💡  
            _– The Directions North America 2026 Hackathon Team_

      - name: Friendly comment — late
        if: steps.check.outputs.on_time != 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👋 Hi @${{ github.event.issue.user.login }}!  
            Thanks for sharing your **Directions North America 2026 Hackathon idea**.

            ⚠️ This submission was **after the deadline** (14:30 EDT on Apr 29, 2026).  
            While it won't be eligible for the 2027 prize, we still encourage you to keep building and sharing progress — great ideas deserve momentum!  

            _– The Directions North America 2026 Hackathon Team_
